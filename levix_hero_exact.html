<script>
  document.addEventListener('DOMContentLoaded', () => {
    const videos = document.querySelectorAll('.hero-video');

    if (!videos.length) return;

    const tryPlay = (video) => {
      if (video.paused) {
        const p = video.play();
        if (p !== undefined) {
          p.catch(() => {});
        }
      }
    };

    // Initial attempt
    videos.forEach((v) => tryPlay(v));

    // iOS-approved user interaction fallback
    const interactionEvents = ['touchstart', 'click', 'pointerdown'];

    const onUserInteraction = () => {
      videos.forEach((v) => tryPlay(v));
      interactionEvents.forEach((evt) => document.removeEventListener(evt, onUserInteraction));
    };

    interactionEvents.forEach((evt) => document.addEventListener(evt, onUserInteraction, { once: true }));

    // Resume if Safari pauses it (common in Low Power Mode)
    videos.forEach((video) => {
      video.addEventListener('pause', () => {
        setTimeout(() => tryPlay(video), 500);
      });
    });
  });
</script>
